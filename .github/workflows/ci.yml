name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test with nothing installed
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Install and run the console script
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          s2psee --version
          s2psee --demo | tee demo.txt
          grep -q "S21" demo.txt
          s2psee --demo --smith | tee smith.txt
          grep -q "Smith" smith.txt
