[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s2psee"
dynamic = ["version"]
description = "Open a Touchstone .s2p file and see S11/S21 in your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shurong Cao", email = "170531907+CAOShurong@users.noreply.github.com" }]
keywords = [
    "s2p", "touchstone", "s-parameters", "rf", "vna", "microwave",
    "cli", "terminal", "s11", "s21", "scatter-parameters",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
s2psee = "s2psee.cli:main"

[project.urls]
Homepage = "https://github.com/CAOShurong/s2psee"
Issues = "https://github.com/CAOShurong/s2psee/issues"
Changelog = "https://github.com/CAOShurong/s2psee/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/s2psee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s2psee"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
